name: drafts
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  pages: read
jobs:
  drafts:
    # deploy.yml posts Live + drafts on the merged PR (commit comment if none).
    # Kept as a no-op so older workflow_run watches don't break.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Skip — deploy.yml posts on the PR
        run: echo "deploy.yml posts Live/video/drafts on the merged PR (or commit comment). Nothing to do."
