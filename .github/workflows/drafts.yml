name: drafts
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
  pages: read
jobs:
  drafts:
    # Prefer deploy.yml's commit comment for paste/build pushes.
    # Still post on a merged PR when one exists (protocol / agent PR path).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;
            const prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha })).data
              .filter(p => p.merged_at);
            if (!prs.length) { core.info(`No merged PR for ${sha}; deploy.yml posts commit comments.`); return; }
            const pr = prs[0];
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            const slugs = [...new Set(files.filter(f => f.status === 'added' && /^demos\/[^/]+\/index\.html$/.test(f.filename))
              .map(f => f.filename.split('/')[1]))];
            if (!slugs.length) { core.info('PR added no new demos.'); return; }

            const read = async (p) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: p, ref: sha });
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            let base = '';
            try { base = (JSON.parse(await read('site.json')).base_url || '').trim(); } catch {}
            if (!base) {
              try { base = (await github.rest.repos.getPages({ owner, repo })).data.html_url; }
              catch { base = repo.toLowerCase() === `${owner.toLowerCase()}.github.io` ? `https://${owner.toLowerCase()}.github.io` : `https://${owner.toLowerCase()}.github.io/${repo}`; }
            }
            base = base.replace(/\/$/, '');

            for (const slug of slugs) {
              let meta = { title: slug, pitch: '' };
              try { meta = { ...meta, ...JSON.parse(await read(`demos/${slug}/demo.json`)) }; } catch {
                try {
                  const html = await read(`demos/${slug}/index.html`);
                  const tm = html.match(/<title>(.*?)<\/title>/i); if (tm) meta.title = tm[1].trim();
                  const dm = html.match(/<meta\s+name=["']description["']\s+content=["'](.*?)["']/i); if (dm) meta.pitch = dm[1].trim();
                } catch {}
              }
              const live = `${base}/${slug}/`;
              const video = `${base}/${slug}/demo.mp4`;
              const linkedin = [
                `New demo: ${meta.title}.`, '', `${meta.pitch}`, '',
                `Try it: ${live}`, `20-second video: ${video}`, '',
                'Nothing has been posted.', '', '#buildinpublic',
              ].join('\n');
              let x = `New demo: ${meta.title}. ${meta.pitch} ${live}`;
              if (x.length > 280) x = `New demo: ${meta.title}. ${live}`;
              const body = [
                `<!-- host-and-post:drafts:${slug} -->`,
                `### Live: ${live}`,
                `**Video:** ${video}`, '',
                '> **Nothing has been posted.** Drafts only. Edit them, then publish yourself — or don't.',
                '',
                '<details open><summary>LinkedIn draft</summary>', '', '```text', linkedin, '```', '</details>', '',
                `<details open><summary>X draft (${x.length}/280)</summary>`, '', '```text', x, '```', '</details>',
              ].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
