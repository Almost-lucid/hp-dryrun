name: deploy
on:
  push:
    branches: [main]
    paths:
      - "demos/**"
      - "site.json"
      - "tools/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # build.yml (github-actions[bot]) deploys itself; this workflow covers human/paste pushes.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
      touched: ${{ steps.slugs.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check GitHub Pages is on
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/${REPO}/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages is off. Turn on Settings → Pages → Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi
      - id: pages
        uses: actions/configure-pages@v5
      - name: Work out which demos this push touched
        id: slugs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(for d in demos/*/; do [ -f "$d/index.html" ] && basename "$d"; done)
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-parse -q --verify HEAD^ || true)
          fi
          if [ -z "$BEFORE" ]; then
            touched="$all"
          else
            touched=$(git diff --name-only "$BEFORE" HEAD -- demos/ | awk -F/ 'NF>=3 {print $2}' | sort -u)
          fi
          touched=$(for s in $touched; do [ -f "demos/$s/index.html" ] && echo "$s"; done | tr '\n' ' ')
          untouched=$(for s in $all; do case " $touched " in *" $s "*) ;; *) echo "$s";; esac; done | tr '\n' ' ')
          echo "touched=$touched" >> "$GITHUB_OUTPUT"
          echo "untouched=$untouched" >> "$GITHUB_OUTPUT"
          echo "Touched: ${touched:-none} | Untouched: ${untouched:-none}"
      - name: Build site
        run: |
          rm -rf _site && cp -r demos _site
          node tools/build_index.mjs _site
      - name: Keep existing videos from the live site
        id: keep
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          UNTOUCHED: ${{ steps.slugs.outputs.untouched }}
          TOUCHED: ${{ steps.slugs.outputs.touched }}
        run: |
          base=$(node -p "require('./site.json').base_url || ''")
          base=${base:-$PAGES_URL}; base=${base%/}
          missing=""
          for s in $UNTOUCHED; do
            if curl -fsSL "$base/$s/demo.mp4" -o "_site/$s/demo.mp4"; then
              curl -fsSL "$base/$s/demo-portrait.mp4" -o "_site/$s/demo-portrait.mp4" || rm -f "_site/$s/demo-portrait.mp4"
              curl -fsSL "$base/$s/screenshot.png" -o "_site/$s/screenshot.png" || rm -f "_site/$s/screenshot.png"
              echo "kept $s from $base"
            else
              rm -f "_site/$s/demo.mp4"; missing="$missing $s"; echo "no live video for $s, will record it"
            fi
          done
          echo "record=${TOUCHED}${missing}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.keep.outputs.record != ''
        with:
          node-version: 20
      - name: Install Playwright
        if: steps.keep.outputs.record != ''
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null || true
      - name: Record touched (and missing) demos
        if: steps.keep.outputs.record != ''
        env:
          RECORD: ${{ steps.keep.outputs.record }}
        run: |
          set +e
          SOFT=1 DEMOS_DIR=_site node tools/smoke_record.mjs $RECORD
          for s in $RECORD; do
            cp -f "out/$s/video.mp4" "_site/$s/demo.mp4" 2>/dev/null || true
            cp -f "out/$s/video-portrait.mp4" "_site/$s/demo-portrait.mp4" 2>/dev/null || true
            cp -f "out/$s/screenshot.png" "_site/$s/screenshot.png" 2>/dev/null || true
          done
          ls -R _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Drafts as commit comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOUCHED: ${{ needs.build.outputs.touched }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BASE_URL: ${{ needs.build.outputs.base_url }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, subprocess, re, textwrap, urllib.request
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          token = os.environ["GH_TOKEN"]
          base = (os.environ.get("PAGE_URL") or os.environ.get("BASE_URL") or "").rstrip("/")
          if not base:
              owner, name = repo.split("/", 1)
              base = f"https://{owner.lower()}.github.io/{name}"
          try:
              b = json.loads(pathlib.Path("site.json").read_text()).get("base_url") or ""
              if str(b).strip():
                  base = str(b).strip().rstrip("/")
          except Exception:
              pass
          touched = [s for s in os.environ.get("TOUCHED", "").split() if s]
          if not touched:
              print("no touched slugs")
              raise SystemExit(0)
          # Checkout not present in deploy job — fetch demo.json via API
          def get_file(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/contents/{path}?ref={sha}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as r:
                  data = json.load(r)
              import base64
              return base64.b64decode(data["content"]).decode("utf-8", "replace")
          bodies = []
          for slug in touched:
              title, pitch = slug.replace("-", " ").title(), ""
              try:
                  meta = json.loads(get_file(f"demos/{slug}/demo.json"))
                  title = meta.get("title") or title
                  pitch = meta.get("pitch") or ""
              except Exception:
                  try:
                      html = get_file(f"demos/{slug}/index.html")
                      m = re.search(r"<title>(.*?)</title>", html, re.I | re.S)
                      if m: title = m.group(1).strip()
                      m = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', html, re.I | re.S)
                      if m: pitch = m.group(1).strip()
                  except Exception:
                      pass
              live = f"{base}/{slug}/"
              video = f"{base}/{slug}/demo.mp4"
              linkedin = f"New demo: {title}.\n\n{pitch}\n\nTry it: {live}\n20-second video: {video}\n\nNothing has been posted.\n\n#buildinpublic".strip()
              x = f"New demo: {title}. {live}"
              body = "\n".join([
                  f"<!-- host-and-post:drafts:{slug} -->",
                  f"### Live: {live}",
                  f"**Video:** {video}",
                  "",
                  "> **Nothing has been posted.** Drafts only — edit and publish yourself if you want.",
                  "",
                  "<details open><summary>LinkedIn draft</summary>",
                  "", "```text", linkedin, "```", "</details>", "",
                  f"<details open><summary>X draft ({len(x)}/280)</summary>",
                  "", "```text", x, "```", "</details>",
              ])
              bodies.append(body)
          pathlib.Path("/tmp/commit_comment.md").write_text("\n\n---\n\n".join(bodies))
          PY
          gh api -X POST "repos/${REPO}/commits/${SHA}/comments" -f body="$(cat /tmp/commit_comment.md)"
