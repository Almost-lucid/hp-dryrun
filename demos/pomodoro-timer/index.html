<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pomodoro timer</title>
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f1ee;color:#2a1f1b}
.card{width:min(360px,92vw);background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 30px #0001;text-align:center}
h1{margin:0 0 4px;font-size:22px}.mode{display:flex;gap:6px;justify-content:center;margin:12px 0}
.mode span{padding:4px 12px;border-radius:999px;font-size:13px;background:#f2e9e5;color:#7a5a4f}.mode span.on{background:#c8553d;color:#fff}
.ring{position:relative;width:220px;max-width:70vw;aspect-ratio:1;margin:8px auto}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.time{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1;padding:12px;font-size:16px;font-weight:600;border-radius:12px;border:1px solid #e3d6d0;background:#fff;cursor:pointer}
#start{background:#c8553d;color:#fff;border-color:#c8553d}#start:disabled,#pause:disabled{opacity:.45}
p.s{margin:12px 0 0;font-size:13px;color:#8a7068}</style></head>
<body><main class="card"><h1>Pomodoro timer</h1>
<div class="mode"><span id="m-focus" class="on">Focus 25:00</span><span id="m-break">Break 5:00</span></div>
<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#f2e9e5" stroke-width="8"/>
<circle id="arc" cx="50" cy="50" r="45" fill="none" stroke="#c8553d" stroke-width="8" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg>
<div class="time" id="time">25:00</div></div>
<div class="btns"><button id="start">Start</button><button id="pause" disabled>Pause</button><button id="reset">Reset</button></div>
<p class="s" id="status">Ready to focus.</p></main>
<script>
const LEN={focus:25*60,break:5*60},$=id=>document.getElementById(id);let mode='focus',left=LEN.focus,timer=null;
function draw(){const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');$('time').textContent=`${m}:${s}`;
$('arc').style.strokeDashoffset=282.74*(1-left/LEN[mode]);$('m-focus').classList.toggle('on',mode==='focus');$('m-break').classList.toggle('on',mode==='break');
$('start').disabled=!!timer;$('pause').disabled=!timer;document.title=`${m}:${s} · Pomodoro`;}
function tick(){left--;if(left<=0){mode=mode==='focus'?'break':'focus';left=LEN[mode];$('status').textContent=mode==='break'?'Nice work. Take a break.':'Back to focus.';}draw();}
$('start').onclick=()=>{if(timer)return;timer=setInterval(tick,1000);$('status').textContent=mode==='focus'?'Focusing…':'On a break…';draw();};
$('pause').onclick=()=>{clearInterval(timer);timer=null;$('status').textContent='Paused.';draw();};
$('reset').onclick=()=>{clearInterval(timer);timer=null;mode='focus';left=LEN.focus;$('status').textContent='Ready to focus.';draw();};
draw();
</script></body></html>
